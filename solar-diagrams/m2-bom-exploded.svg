<svg viewBox="0 0 740 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t"><title id="t">Bill of materials exploded view</title>
<style>text{font-family:'DM Sans',system-ui,sans-serif;fill:#fff}.lbl{font-size:10px;fill:#8a8f98;letter-spacing:.1em}.ttl{font-size:11px;font-weight:700}.s{font-size:9px;fill:#8a8f98}.tag{font-size:8px;font-weight:700}</style>
<rect width="740" height="360" fill="#0d0d0d"/>
<text x="28" y="26" class="lbl">MODULE 2 · THE WHOLE BOM — CORE, SAFETY, PLUMBING</text>
<!-- legend -->
<text x="430" y="20" class="tag" fill="#ffb400">■ CORE</text><text x="510" y="20" class="tag" fill="#ff7070">■ SAFETY</text><text x="600" y="20" class="tag" fill="#53d8fb">■ PLUMBING</text>
<!-- CORE row (top, large) -->
<g>
<rect x="28" y="44" width="120" height="58" rx="8" fill="#1c1812" stroke="#ffb400"/><text x="88" y="70" text-anchor="middle" class="ttl">Panels</text><text x="88" y="88" text-anchor="middle" class="tag" fill="#ffb400">CORE</text>
<rect x="162" y="44" width="120" height="58" rx="8" fill="#1c1812" stroke="#ffb400"/><text x="222" y="70" text-anchor="middle" class="ttl">Charge ctrl</text><text x="222" y="88" text-anchor="middle" class="tag" fill="#ffb400">CORE</text>
<rect x="296" y="44" width="140" height="58" rx="8" fill="#1c1812" stroke="#ffb400"/><text x="366" y="70" text-anchor="middle" class="ttl">Battery + BMS</text><text x="366" y="88" text-anchor="middle" class="tag" fill="#ffb400">CORE</text>
<rect x="450" y="44" width="120" height="58" rx="8" fill="#1c1812" stroke="#ffb400"/><text x="510" y="70" text-anchor="middle" class="ttl">Inverter</text><text x="510" y="88" text-anchor="middle" class="tag" fill="#ffb400">CORE</text>
<rect x="584" y="44" width="128" height="58" rx="8" fill="#1c1812" stroke="#ffb400"/><text x="648" y="70" text-anchor="middle" class="ttl">Distribution</text><text x="648" y="88" text-anchor="middle" class="tag" fill="#ffb400">CORE</text>
</g>
<text x="28" y="128" class="lbl">— the glue &amp; the seatbelts connecting them —</text>
<!-- SAFETY + PLUMBING tier -->
<g>
<rect x="28" y="142" width="108" height="46" rx="7" fill="#1c0e0e" stroke="#ff7070"/><text x="82" y="164" text-anchor="middle" class="s" fill="#fff">Fuses / breakers</text><text x="82" y="180" text-anchor="middle" class="tag" fill="#ff7070">SAFETY</text>
<rect x="146" y="142" width="108" height="46" rx="7" fill="#1c0e0e" stroke="#ff7070"/><text x="200" y="164" text-anchor="middle" class="s" fill="#fff">DC + AC disconnect</text><text x="200" y="180" text-anchor="middle" class="tag" fill="#ff7070">SAFETY</text>
<rect x="264" y="142" width="108" height="46" rx="7" fill="#1c0e0e" stroke="#ff7070"/><text x="318" y="164" text-anchor="middle" class="s" fill="#fff">Grounding / bond</text><text x="318" y="180" text-anchor="middle" class="tag" fill="#ff7070">SAFETY</text>
<rect x="382" y="142" width="108" height="46" rx="7" fill="#1c0e0e" stroke="#ff7070"/><text x="436" y="164" text-anchor="middle" class="s" fill="#fff">SPD (surge)</text><text x="436" y="180" text-anchor="middle" class="tag" fill="#ff7070">SAFETY</text>
<rect x="500" y="142" width="100" height="46" rx="7" fill="#0e1620" stroke="#53d8fb"/><text x="550" y="164" text-anchor="middle" class="s" fill="#fff">Combiner box</text><text x="550" y="180" text-anchor="middle" class="tag" fill="#53d8fb">PLUMBING</text>
<rect x="608" y="142" width="104" height="46" rx="7" fill="#0e1620" stroke="#53d8fb"/><text x="660" y="164" text-anchor="middle" class="s" fill="#fff">Busbars</text><text x="660" y="180" text-anchor="middle" class="tag" fill="#53d8fb">PLUMBING</text>
<rect x="28" y="198" width="108" height="46" rx="7" fill="#0e1620" stroke="#53d8fb"/><text x="82" y="220" text-anchor="middle" class="s" fill="#fff">Cable / lugs</text><text x="82" y="236" text-anchor="middle" class="tag" fill="#53d8fb">PLUMBING</text>
<rect x="146" y="198" width="108" height="46" rx="7" fill="#0e1620" stroke="#53d8fb"/><text x="200" y="220" text-anchor="middle" class="s" fill="#fff">Shunt / monitor</text><text x="200" y="236" text-anchor="middle" class="tag" fill="#53d8fb">PLUMBING</text>
</g>
<rect x="28" y="262" width="684" height="74" rx="9" fill="#161616" stroke="#2a2a2a"/><text x="44" y="284" class="ttl" fill="#ffb400">The one rule for the whole list</text><text x="44" y="306" class="s">Put one of three letters next to every line on your Solar Sizer list — C (core), S (safety), P (plumbing: wire, lugs, busbars, monitor).</text><text x="44" y="324" class="s" fill="#ffd98a">By the end of Module 2 every line has a letter and you know why it's there — and which ones you can skip.</text>
</svg>
