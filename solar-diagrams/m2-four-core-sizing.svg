<svg viewBox="0 0 740 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t"><title id="t">The four core boxes and their sizing rules</title>
<style>text{font-family:'DM Sans',system-ui,sans-serif;fill:#fff}.lbl{font-size:10px;fill:#8a8f98;letter-spacing:.1em}.ttl{font-size:13px;font-weight:700}.s{font-size:9.5px;fill:#8a8f98}.k{font-size:9.5px;fill:#ffb400}</style>
<rect width="740" height="300" fill="#0d0d0d"/>
<text x="28" y="30" class="lbl">MODULE 2 · THE FOUR CORE BOXES (sized to YOUR load)</text>
<rect x="28" y="58" width="160" height="140" rx="9" fill="#161616" stroke="#2a2a2a"/><text x="108" y="92" text-anchor="middle" class="ttl">Panels</text><text x="108" y="111" text-anchor="middle" class="s">+ racking under</text><text x="108" y="150" text-anchor="middle" class="k">daily Wh / sun-hrs</text><text x="108" y="166" text-anchor="middle" class="k">x 125% buffer</text>
<rect x="206" y="58" width="190" height="140" rx="9" fill="#1c1812" stroke="#ffb400"/><text x="301" y="88" text-anchor="middle" class="ttl" fill="#ffb400">All-in-One brain</text><text x="301" y="107" text-anchor="middle" class="s">controller + inverter + charger</text><text x="301" y="133" text-anchor="middle" class="k">inverter at least 1.2x load</text><text x="301" y="148" text-anchor="middle" class="s">(derates with heat)</text><text x="301" y="170" text-anchor="middle" class="k">controller = output amps</text><text x="301" y="185" text-anchor="middle" class="k">100A ≈ 4,800W @ 48V</text>
<rect x="414" y="58" width="160" height="140" rx="9" fill="#161616" stroke="#2a2a2a"/><text x="494" y="92" text-anchor="middle" class="ttl">48V LiFePO4</text><text x="494" y="111" text-anchor="middle" class="s">battery + BMS</text><text x="494" y="150" text-anchor="middle" class="k">~12 kWh bank</text><text x="494" y="166" text-anchor="middle" class="k">4,000-8,000 cycles</text><text x="494" y="182" text-anchor="middle" class="s">~1 day autonomy</text>
<rect x="592" y="58" width="120" height="140" rx="9" fill="#161616" stroke="#2a2a2a"/><text x="652" y="92" text-anchor="middle" class="ttl">Loads</text><text x="652" y="150" text-anchor="middle" class="s">120/240V AC</text><text x="652" y="166" text-anchor="middle" class="s">your house</text>
<line x1="188" y1="128" x2="206" y2="128" stroke="#5b6068" stroke-width="2"/><line x1="396" y1="128" x2="414" y2="128" stroke="#ffb400" stroke-width="4"/><line x1="574" y1="128" x2="592" y2="128" stroke="#5b6068" stroke-width="2"/>
<text x="28" y="240" class="s">Each box is sized off the one before it — start at your real loads (Module 1), and every number downstream follows.</text>
<text x="28" y="262" class="k">★ the all-in-one is the smartest single buy: fewer boxes, fewer wires, fewer things to get wrong at 11pm.</text>
</svg>
