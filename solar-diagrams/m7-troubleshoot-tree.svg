<svg viewBox="0 0 740 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t"><title id="t">Off-grid solar troubleshooting decision tree</title>
<style>text{font-family:'DM Sans',system-ui,sans-serif;fill:#fff}.lbl{font-size:10px;fill:#8a8f98;letter-spacing:.1em}.p{font-size:12px;font-weight:700;fill:#fff}.q{font-size:10px;fill:#8a8f98}.gate{font-size:11px;font-weight:700;fill:#ffb400}.red{font-size:11px;font-weight:700;fill:#ff7070}</style>
<rect width="740" height="430" fill="#0d0d0d"/>
<text x="28" y="30" class="lbl">MODULE 7 · WHEN IT THROWS A CODE — WALK THE TREE</text>
<rect x="270" y="46" width="200" height="40" rx="9" fill="#161616" stroke="#2a2a2a"/><text x="370" y="71" text-anchor="middle" class="p">Not working / threw a code</text>
<line x1="370" y1="86" x2="370" y2="104" stroke="#3a3f46"/>
<rect x="290" y="104" width="160" height="36" rx="8" fill="#1c1812" stroke="#ffb400"/><text x="370" y="127" text-anchor="middle" class="gate">Is the display ON?</text>
<!-- NO branch -->
<line x1="290" y1="122" x2="120" y2="122" stroke="#3a3f46"/><line x1="120" y1="122" x2="120" y2="150" stroke="#3a3f46"/>
<rect x="40" y="150" width="160" height="56" rx="8" fill="#161616" stroke="#2a2a2a"/><text x="50" y="168" class="q" fill="#ff9a9a">NO →</text><text x="50" y="184" class="q">battery/DC path: meter the</text><text x="50" y="198" class="q">battery, DC switch, polarity+torque</text>
<!-- YES branch: the spine -->
<line x1="450" y1="122" x2="600" y2="122" stroke="#3a3f46"/><line x1="600" y1="122" x2="600" y2="150" stroke="#3a3f46"/>
<text x="540" y="118" class="q">YES — walk the spine ↓</text>
<g>
<rect x="540" y="150" width="160" height="30" rx="7" fill="#161616" stroke="#2a2a2a"/><text x="620" y="170" text-anchor="middle" class="p">1 · SUN</text>
<rect x="540" y="186" width="160" height="30" rx="7" fill="#161616" stroke="#2a2a2a"/><text x="620" y="206" text-anchor="middle" class="p">2 · WIRING</text>
<rect x="540" y="222" width="160" height="30" rx="7" fill="#161616" stroke="#2a2a2a"/><text x="620" y="242" text-anchor="middle" class="p">3 · SETTING</text>
<rect x="540" y="258" width="160" height="30" rx="7" fill="#161616" stroke="#2a2a2a"/><text x="620" y="278" text-anchor="middle" class="p">4 · GEAR</text>
<line x1="620" y1="180" x2="620" y2="186" stroke="#3a3f46"/><line x1="620" y1="216" x2="620" y2="222" stroke="#3a3f46"/><line x1="620" y1="252" x2="620" y2="258" stroke="#3a3f46"/>
<text x="528" y="170" text-anchor="end" class="q">clouds/shade?</text><text x="528" y="206" text-anchor="end" class="q">loose/thin cable?</text><text x="528" y="242" text-anchor="end" class="q">battery type/profile?</text><text x="528" y="278" text-anchor="end" class="q">fault code → table</text>
</g>
<!-- RED off-ramps -->
<rect x="40" y="300" width="320" height="50" rx="9" fill="#1c0e0e" stroke="#ff7070" stroke-width="1.5"/><text x="56" y="322" class="red">⛔ STOP — call a licensed electrician:</text><text x="56" y="340" class="q" fill="#ffb3b3">arc fault / AFCI alarm</text>
<rect x="380" y="300" width="320" height="50" rx="9" fill="#1c0e0e" stroke="#ff7070" stroke-width="1.5"/><text x="396" y="322" class="red">⛔ STOP — call a licensed electrician:</text><text x="396" y="340" class="q" fill="#ffb3b3">ground fault / GFCI · burning smell · melted lugs</text>
<text x="28" y="384" class="q">Most codes resolve to airflow, shed-load, a loose wire, or a wrong setting. The two RED boxes are the only ones you don't troubleshoot — you stop.</text>
<text x="28" y="406" class="q" fill="#8a8f98">Codes vary by brand/model/firmware — confirm in YOUR unit's manual.</text>
</svg>
