<svg viewBox="0 0 740 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t"><title id="t">Which rig is right for you</title>
<style>text{font-family:'DM Sans',system-ui,sans-serif;fill:#fff}.lbl{font-size:10px;fill:#8a8f98;letter-spacing:.1em}.q{font-size:12px;font-weight:700;fill:#ffb400}.p{font-size:12px;font-weight:700;fill:#fff}.s{font-size:10px;fill:#8a8f98}.e{font-size:10px;fill:#d7d9dd}</style>
<rect width="740" height="380" fill="#0d0d0d"/>
<text x="28" y="30" class="lbl">MODULE 6 · WHICH RIG IS RIGHT FOR YOU?</text>
<rect x="280" y="46" width="180" height="38" rx="9" fill="#1c1812" stroke="#ffb400"/><text x="370" y="70" text-anchor="middle" class="q">Does it need to MOVE?</text>
<!-- YES -->
<line x1="280" y1="65" x2="150" y2="65" stroke="#3a3f46"/><line x1="150" y1="65" x2="150" y2="100" stroke="#3a3f46"/>
<text x="200" y="60" class="s">YES</text>
<rect x="40" y="100" width="220" height="36" rx="8" fill="#161616" stroke="#2a2a2a"/><text x="150" y="123" text-anchor="middle" class="q">Live in it?</text>
<line x1="80" y1="136" x2="80" y2="160" stroke="#3a3f46"/><line x1="220" y1="136" x2="220" y2="160" stroke="#3a3f46"/>
<rect x="20" y="160" width="120" height="60" rx="8" fill="#161616" stroke="#2a2a2a"/><text x="80" y="182" text-anchor="middle" class="p">RV / van rig</text><text x="80" y="200" text-anchor="middle" class="s">built, 3 charge</text><text x="80" y="214" text-anchor="middle" class="s">sources (6.1)</text>
<rect x="160" y="160" width="120" height="60" rx="8" fill="#161616" stroke="#2a2a2a"/><text x="220" y="182" text-anchor="middle" class="p">Power station</text><text x="220" y="200" text-anchor="middle" class="s">carry by hand</text>
<!-- NO -->
<line x1="460" y1="65" x2="600" y2="65" stroke="#3a3f46"/><line x1="600" y1="65" x2="600" y2="100" stroke="#3a3f46"/>
<text x="540" y="60" class="s">NO</text>
<rect x="490" y="100" width="220" height="36" rx="8" fill="#161616" stroke="#2a2a2a"/><text x="600" y="123" text-anchor="middle" class="q">Total daily need?</text>
<line x1="540" y1="136" x2="540" y2="160" stroke="#3a3f46"/><line x1="660" y1="136" x2="660" y2="160" stroke="#3a3f46"/>
<rect x="480" y="160" width="120" height="60" rx="8" fill="#161616" stroke="#2a2a2a"/><text x="540" y="178" text-anchor="middle" class="p">Power station</text><text x="540" y="196" text-anchor="middle" class="s">small / temporary</text><text x="540" y="210" text-anchor="middle" class="s">can't wire</text>
<rect x="620" y="160" width="100" height="60" rx="8" fill="#1c1812" stroke="#ffb400"/><text x="670" y="178" text-anchor="middle" class="p" fill="#ffb400">Built 48V</text><text x="670" y="196" text-anchor="middle" class="s">household</text><text x="670" y="210" text-anchor="middle" class="s">~10-30kWh (M1-5)</text>
<!-- tradeoffs -->
<rect x="40" y="248" width="320" height="86" rx="9" fill="#161616" stroke="#2a2a2a"/><text x="56" y="270" class="p">Power station</text><text x="56" y="290" class="e">+ no install, grab and go</text><text x="56" y="308" class="e" fill="#ff9a9a">- capped capacity</text><text x="56" y="326" class="e" fill="#ff9a9a">- capped solar input (the trap)</text>
<rect x="380" y="248" width="320" height="86" rx="9" fill="#1c1812" stroke="#ffb400"/><text x="396" y="270" class="p" fill="#ffb400">Built 48V system</text><text x="396" y="290" class="e">+ most capacity, cheapest per kWh</text><text x="396" y="308" class="e">+ expandable</text><text x="396" y="326" class="e" fill="#8a8f98">- you wire it (that's what the course is for)</text>
</svg>
