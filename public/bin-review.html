<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bin Review — RR S2</title>
<style>
  :root { --bg:#0b0f0e; --card:#141a19; --line:#233230; --teal:#14b8a6; --amber:#f59e0b; --text:#d7e0de; --dim:#7c8a87; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; padding: 16px; }
  h1 { font-size: 20px; color: var(--teal); margin-bottom: 4px; }
  .sub { color: var(--dim); margin-bottom: 14px; }
  .bar { position: sticky; top: 0; background: var(--bg); padding: 10px 0; z-index: 5; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  select, input[type=text], button { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font-size: 13px; }
  button { cursor: pointer; }
  button.primary { background: var(--teal); color: #05201c; font-weight: 700; border: 0; }
  .count { color: var(--amber); font-weight: 700; }
  .group-h { margin: 22px 0 10px; font-size: 15px; color: var(--amber); border-bottom: 1px solid var(--line); padding-bottom: 5px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .card.changed { border-color: var(--amber); }
  .thumbwrap { position: relative; aspect-ratio: 16/9; background: #000; }
  .thumbwrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .noThumb { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--dim); font-size: 12px; }
  .meta { padding: 9px 11px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .idline { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .id { color: var(--teal); font-weight: 700; }
  .dur, .st { color: var(--dim); font-size: 12px; }
  .binbadge { font-size: 11px; background: #0f2a26; color: var(--teal); padding: 2px 8px; border-radius: 999px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .desc { color: #b7c4c1; font-size: 12.5px; max-height: 54px; overflow: hidden; cursor: pointer; }
  .desc.open { max-height: none; }
  .controls { display: flex; gap: 6px; margin-top: auto; }
  .controls select { flex: 1; min-width: 0; }
  .note { width: 100%; }
  .pill { font-size: 11px; color: var(--dim); }
</style>
</head>
<body>
<h1>Bin Review — Rock Rich S2</h1>
<div class="sub">Fix a clip's bin with the dropdown. Changes save locally as you go — hit <b>Copy corrections</b> when done and hand the result to Fable to apply to the bin map.</div>
<div class="bar">
  <select id="groupFilter"><option value="">All groups</option></select>
  <input type="text" id="q" placeholder="search description / filename…" size="30">
  <label><input type="checkbox" id="onlyChanged"> only changed</label>
  <span>changes: <span class="count" id="changeCount">0</span></span>
  <button class="primary" id="copyBtn">Copy corrections</button>
  <button id="clearBtn">Clear all changes</button>
</div>
<div id="app">loading vault…</div>

<script>
var BINMAP = JSON.parse(document.getElementById('binmap').textContent);
var TARGETS = [
  'EP1 — The Reckoning', 'EP2 — The Facade', 'EP3 — Bad Land', 'EP4 — The Ask',
  'EP5 — Where the Water Goes', 'EP6 — Break Ground / The Pour',
  'ACT 2 — Junipers / Build', 'MID-SEASON — Animals', 'WATER MAN thread',
  'HEARTS', 'PTC POOL (Whisper it)', 'FAMILY — CLOUD+LOCAL', 'QUIET STORE (not S2)',
  'NOT S2 — other video', 'JUNK — discard candidate', 'UNSURE — flag Fable'
];
var S2_HINTS = ['rock rich season 2', '680_season-2', 'may-21-26-videodump', 'clearing down the hill', 'shop clean up'];
var LSKEY = 'binreview_v1';
var changes = {};
try { changes = JSON.parse(localStorage.getItem(LSKEY) || '{}'); } catch (e) { changes = {}; }

function saveChanges() {
  try { localStorage.setItem(LSKEY, JSON.stringify(changes)); } catch (e) {}
  var n = Object.keys(changes).length;
  document.getElementById('changeCount').textContent = n;
}

function thumbUrl(f) {
  if (!f.thumbnail_path) return null;
  var base = String(f.thumbnail_path).split(/[\\\/]/).pop();
  return '/thumbnails/' + encodeURIComponent(base);
}

function fmtDur(s) {
  s = Math.round(s || 0);
  var m = Math.floor(s / 60);
  return m > 0 ? (m + 'm' + String(s % 60).padStart(2, '0') + 's') : (s + 's');
}

function groupOf(f) {
  var m = BINMAP[String(f.id)];
  if (m) return m.bin;
  var p = String(f.file_path || '').toLowerCase();
  for (var i = 0; i < S2_HINTS.length; i++) {
    if (p.indexOf(S2_HINTS[i]) !== -1) return 'UNBINNED (S2-adjacent)';
  }
  return null; // not shown
}

var PRIORITY = ['CLUSTERS NEEDING A HUMAN WORD', 'UNBINNED (S2-adjacent)'];

fetch('/api/vault/footage?limit=10000').then(function (r) { return r.json(); }).then(function (d) {
  var all = d.footage || d;
  var groups = {};
  all.forEach(function (f) {
    var g = groupOf(f);
    if (!g) return;
    if (!groups[g]) groups[g] = [];
    groups[g].push(f);
  });
  var names = Object.keys(groups).sort(function (a, b) {
    var pa = PRIORITY.indexOf(a) !== -1 ? PRIORITY.indexOf(a) : 99;
    var pb = PRIORITY.indexOf(b) !== -1 ? PRIORITY.indexOf(b) : 99;
    if (pa !== pb) return pa - pb;
    return groups[b].length - groups[a].length;
  });
  var gf = document.getElementById('groupFilter');
  names.forEach(function (n) {
    var o = document.createElement('option');
    o.value = n; o.textContent = n + ' (' + groups[n].length + ')';
    gf.appendChild(o);
  });
  render(groups, names);
  document.getElementById('groupFilter').addEventListener('change', function () { render(groups, names); });
  document.getElementById('q').addEventListener('input', function () { render(groups, names); });
  document.getElementById('onlyChanged').addEventListener('change', function () { render(groups, names); });
  saveChanges();
}).catch(function (e) {
  document.getElementById('app').textContent = 'failed to load vault: ' + e;
});

function render(groups, names) {
  var app = document.getElementById('app');
  app.innerHTML = '';
  var filterG = document.getElementById('groupFilter').value;
  var q = document.getElementById('q').value.toLowerCase();
  var onlyCh = document.getElementById('onlyChanged').checked;
  names.forEach(function (g) {
    if (filterG && g !== filterG) return;
    var clips = groups[g].filter(function (f) {
      if (onlyCh && !changes[f.id]) return false;
      if (!q) return true;
      var hay = ((f.description || '') + ' ' + (f.file_path || '')).toLowerCase();
      return hay.indexOf(q) !== -1;
    });
    if (!clips.length) return;
    var h = document.createElement('div');
    h.className = 'group-h';
    h.textContent = g + '  (' + clips.length + ')';
    app.appendChild(h);
    var grid = document.createElement('div');
    grid.className = 'grid';
    clips.forEach(function (f) { grid.appendChild(card(f, g)); });
    app.appendChild(grid);
  });
  if (!app.children.length) app.textContent = 'nothing matches the filters';
}

function card(f, currentBin) {
  var el = document.createElement('div');
  el.className = 'card' + (changes[f.id] ? ' changed' : '');
  var tw = document.createElement('div');
  tw.className = 'thumbwrap';
  var tu = thumbUrl(f);
  if (tu) {
    var img = document.createElement('img');
    img.loading = 'lazy';
    img.src = tu;
    img.onerror = function () { tw.innerHTML = '<div class="noThumb">no thumbnail</div>'; };
    tw.appendChild(img);
  } else {
    tw.innerHTML = '<div class="noThumb">no thumbnail</div>';
  }
  el.appendChild(tw);

  var meta = document.createElement('div');
  meta.className = 'meta';
  var name = String(f.file_path || '').split(/[\\\/]/).pop();
  var idline = document.createElement('div');
  idline.className = 'idline';
  idline.innerHTML = '<span class="id">' + f.id + '</span>' +
    '<span class="dur">' + fmtDur(f.duration_seconds || f.duration) + '</span>' +
    '<span class="st">' + (f.shot_type || '?') + '</span>';
  meta.appendChild(idline);
  var nm = document.createElement('div');
  nm.className = 'pill';
  nm.textContent = name;
  meta.appendChild(nm);
  var badge = document.createElement('div');
  badge.className = 'binbadge';
  badge.title = currentBin;
  badge.textContent = currentBin;
  meta.appendChild(badge);
  var desc = document.createElement('div');
  desc.className = 'desc';
  desc.textContent = f.description || '(no description)';
  desc.addEventListener('click', function () { desc.classList.toggle('open'); });
  meta.appendChild(desc);

  var ctr = document.createElement('div');
  ctr.className = 'controls';
  var sel = document.createElement('select');
  var keep = document.createElement('option');
  keep.value = '';
  keep.textContent = '✓ keep bin';
  sel.appendChild(keep);
  TARGETS.forEach(function (t) {
    var o = document.createElement('option');
    o.value = t; o.textContent = '→ ' + t;
    sel.appendChild(o);
  });
  if (changes[f.id]) sel.value = changes[f.id].to || '';
  sel.addEventListener('change', function () {
    if (sel.value) {
      changes[f.id] = changes[f.id] || {};
      changes[f.id].to = sel.value;
      changes[f.id].from = currentBin;
      el.classList.add('changed');
    } else {
      delete changes[f.id];
      el.classList.remove('changed');
    }
    saveChanges();
  });
  ctr.appendChild(sel);
  meta.appendChild(ctr);
  var note = document.createElement('input');
  note.type = 'text';
  note.className = 'note';
  note.placeholder = 'note (optional)';
  if (changes[f.id] && changes[f.id].note) note.value = changes[f.id].note;
  note.addEventListener('input', function () {
    if (note.value) {
      changes[f.id] = changes[f.id] || { from: currentBin };
      changes[f.id].note = note.value;
      el.classList.add('changed');
    } else if (changes[f.id]) {
      delete changes[f.id].note;
      if (!changes[f.id].to) { delete changes[f.id]; el.classList.remove('changed'); }
    }
    saveChanges();
  });
  meta.appendChild(note);
  el.appendChild(meta);
  return el;
}

document.getElementById('copyBtn').addEventListener('click', function () {
  var out = JSON.stringify(changes, null, 1);
  // Also persist server-side (durable inbox — survives cleared localStorage).
  // Silently no-ops on servers that don't have the endpoint yet.
  try {
    fetch('/api/shots/bin-corrections', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: out
    }).catch(function () {});
  } catch (_) {}
  navigator.clipboard.writeText(out).then(function () {
    document.getElementById('copyBtn').textContent = 'Copied ' + Object.keys(changes).length + ' ✓';
    setTimeout(function () { document.getElementById('copyBtn').textContent = 'Copy corrections'; }, 2000);
  });
});
document.getElementById('clearBtn').addEventListener('click', function () {
  if (confirm('Clear ALL pending corrections?')) {
    changes = {};
    saveChanges();
    location.reload();
  }
});
</script>
