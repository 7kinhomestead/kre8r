<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Kill Review — The Great Archive</title>
<style>
:root{--black:#080808;--dark:#0f0f0f;--card:#161616;--border:#252525;--border2:#333;
--white:#fff;--off:rgba(255,255,255,.82);--muted:rgba(255,255,255,.38);
--teal:#14b8a6;--red:#ef4444;--amber:#f59e0b;--green:#22c55e;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--black);color:var(--white);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;padding-bottom:90px;}
header{position:sticky;top:0;background:var(--dark);border-bottom:1px solid var(--border2);padding:12px 16px;z-index:50;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
h1{font-size:16px;letter-spacing:.04em;}
h1 span{color:var(--teal);}
.tabs{display:flex;gap:6px;}
.tab{background:var(--card);border:1px solid var(--border2);border-radius:6px;padding:6px 12px;font-size:12px;color:var(--off);cursor:pointer;}
.tab.on{border-color:var(--teal);color:var(--teal);}
#stats{font-size:11px;color:var(--muted);margin-left:auto;}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;padding:14px;}
.clip{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;}
.clip.rescued{border-color:var(--green);box-shadow:0 0 0 1px var(--green);}
.clip img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;display:block;}
.clip .meta{padding:8px 10px;flex:1;display:flex;flex-direction:column;gap:4px;}
.clip .nm{font-size:12px;font-weight:600;word-break:break-all;}
.clip .desc{font-size:11px;color:var(--muted);line-height:1.45;max-height:64px;overflow:hidden;}
.clip .row{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--muted);margin-top:auto;padding-top:4px;}
.clip .gb{color:var(--amber);font-weight:700;}
.clip button{border:1px solid var(--border2);background:none;border-radius:6px;padding:5px 10px;font-size:11px;color:var(--off);cursor:pointer;}
.clip button:hover{border-color:var(--green);color:var(--green);}
.clip.rescued button{border-color:var(--green);color:var(--green);}
.warnband{margin:14px;padding:10px 14px;background:rgba(239,68,68,.08);border:1px solid var(--red);border-radius:10px;font-size:12px;color:var(--off);}
#bar{position:fixed;bottom:0;left:0;right:0;background:var(--dark);border-top:1px solid var(--border2);padding:10px 16px;display:flex;gap:12px;align-items:center;z-index:60;}
#bar .cnt{font-size:13px;}
#bar .cnt b{color:var(--green);}
#bar button{background:var(--teal);color:#04302b;border:none;border-radius:7px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;}
#bar .hint{font-size:11px;color:var(--muted);}
.loadmsg{padding:40px;text-align:center;color:var(--muted);}
select{background:var(--card);color:var(--off);border:1px solid var(--border2);border-radius:6px;padding:6px 8px;font-size:12px;}
</style>
</head>
<body>
<header>
  <h1>KILL REVIEW — <span>THE GREAT ARCHIVE</span></h1>
  <div class="tabs">
    <button class="tab on" data-v="KILL" onclick="setTab(this.dataset.v)">Kill list</button>
    <button class="tab" data-v="CLOUD" onclick="setTab(this.dataset.v)">Cloud archive</button>
    <button class="tab" data-v="CLOUD+LOCAL" onclick="setTab(this.dataset.v)">Sentimental</button>
  </div>
  <select id="typeFilter" onchange="renderGrid()">
    <option value="">All types</option>
    <option>b-roll</option><option>talking-head</option><option>action</option>
    <option>dialogue</option><option>completed-video</option><option>unusable</option>
  </select>
  <div id="stats"></div>
</header>
<div class="warnband" id="flaggedBand" style="display:none"></div>
<div id="grid"><div class="loadmsg">Loading the vault…</div></div>
<div id="bar">
  <div class="cnt"><b id="rescueCount">0</b> rescued from this list</div>
  <button onclick="copyExceptions()">📋 Copy rescue list for Fable</button>
  <div class="hint">Tap a card's RESCUE to save it from its verdict. Rescues persist in this browser. When done: copy the list, paste it to Fable.</div>
</div>
<script>
'use strict';
var CUTOFF = '2026-01-12';
var RISKY = /final|episode|rock ?rich|rre|full cut|rough cut|master/i;
var SENT = /merlin|dakota|family|kids|cari|wedding|birthday/i;
var all = [], tab = 'KILL';
var rescues = {};
try { rescues = JSON.parse(localStorage.getItem('archive_rescues') || '{}'); } catch(e){ rescues = {}; }

function verdictOf(f){
  var p = (f.file_path||''), name = (f.original_filename||'');
  var when = ((f.creation_timestamp || f.ingested_at || '')+'').slice(0,10);
  var isBraw = /\.braw$/i.test(p);
  var oldish = when && when < CUTOFF;
  if (!oldish) return 'KEEP';
  if (SENT.test(p+name)) return 'CLOUD+LOCAL';
  if (f.shot_type==='completed-video') return 'KEEP';
  if (f.quality_flag==='discard' || f.shot_type==='unusable') return 'KILL';
  if (isBraw) return 'CLOUD';
  if (f.quality_flag==='hero' || (f.used_in && (''+f.used_in).length>2)) return 'CLOUD';
  return 'KILL';
}
function gbOf(f){ return (f.file_size||0)/1073741824; }

function setTab(v){
  tab = v;
  var tabs = document.querySelectorAll('.tab'), i;
  for(i=0;i<tabs.length;i++) tabs[i].className = 'tab' + (tabs[i].dataset.v===v?' on':'');
  renderGrid();
}
function toggleRescue(id){
  if (rescues[id]) delete rescues[id]; else rescues[id] = tab;
  try { localStorage.setItem('archive_rescues', JSON.stringify(rescues)); } catch(e){}
  var el = document.getElementById('clip_'+id);
  if (el) el.className = 'clip' + (rescues[id]?' rescued':'');
  updateCount();
}
function updateCount(){
  document.getElementById('rescueCount').textContent = Object.keys(rescues).length;
}
function copyExceptions(){
  var ids = Object.keys(rescues);
  var txt = ids.length ? ('rescue these from their verdicts: ' + ids.join(', ')) : 'no rescues — all verdicts approved as-is';
  var done = function(){ var b = document.querySelector('#bar button'); b.textContent = '✓ Copied — paste it to Fable'; setTimeout(function(){ b.textContent = '📋 Copy rescue list for Fable'; }, 2500); };
  try { navigator.clipboard.writeText(txt).then(done); } catch(e){ prompt('Copy this:', txt); }
}
function esc(s){ return (''+(s||'')).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function renderGrid(){
  var tf = document.getElementById('typeFilter').value;
  var list = [], i, f;
  for(i=0;i<all.length;i++){
    f = all[i];
    if (f._v !== tab) continue;
    if (tf && f.shot_type !== tf) continue;
    list.push(f);
  }
  list.sort(function(a,b){ return gbOf(b)-gbOf(a); });
  var totGb = 0; for(i=0;i<list.length;i++) totGb += gbOf(list[i]);
  document.getElementById('stats').textContent = list.length + ' clips · ' + totGb.toFixed(0) + ' GB in this view';

  var html = '', shown = 0;
  for(i=0;i<list.length && shown<600;i++){
    f = list[i]; shown++;
    var id = f.id;
    var thumb = f.thumbnail_path ? esc(f.thumbnail_path) : '';
    var when = ((f.creation_timestamp||f.ingested_at||'')+'').slice(0,10);
    html += '<div class="clip'+(rescues[id]?' rescued':'')+'" id="clip_'+id+'">'
      + (thumb ? '<img loading="lazy" src="'+thumb+'" alt="" onerror="this.style.display=\'none\'">' : '')
      + '<div class="meta">'
      + '<div class="nm">#'+id+' · '+esc(f.original_filename || (f.file_path||'').split('\\').pop())+'</div>'
      + '<div class="desc">'+esc(f.description || 'no description recorded')+'</div>'
      + '<div class="row"><span>'+esc(f.shot_type||'?')+' · '+when+'</span><span class="gb">'+gbOf(f).toFixed(1)+' GB</span>'
      + '<button onclick="toggleRescue('+id+')">'+(rescues[id]?'✓ RESCUED':'RESCUE')+'</button></div>'
      + '</div></div>';
  }
  if (list.length > shown) html += '<div class="loadmsg">…and '+(list.length-shown)+' smaller clips (everything above covers the tonnage — the rest are under '+gbOf(list[shown-1]).toFixed(1)+' GB each)</div>';
  if (!html) html = '<div class="loadmsg">Nothing in this bucket 🎉</div>';
  document.getElementById('grid').innerHTML = html;

  var flagged = [], j;
  for(j=0;j<all.length;j++){ f = all[j]; if (f._v==='KILL' && RISKY.test((f.original_filename||'')+(f.file_path||''))) flagged.push(f); }
  var band = document.getElementById('flaggedBand');
  if (tab==='KILL' && flagged.length){
    band.style.display = 'block';
    var names = [];
    for(j=0;j<flagged.length;j++) names.push('#'+flagged[j].id+' '+(flagged[j].original_filename||''));
    band.innerHTML = '<b>⚠ '+flagged.length+' kill-list clips have episode-ish names</b> — scroll for them (they sort by size) and rescue any that are real finals: '+esc(names.join(' · '));
  } else band.style.display = 'none';
}

(function(){
  fetch('/api/vault/footage').then(function(r){ return r.json(); }).then(function(rows){
    all = Array.isArray(rows) ? rows : (rows.rows||[]);
    var i; for(i=0;i<all.length;i++) all[i]._v = verdictOf(all[i]);
    updateCount();
    renderGrid();
  }).catch(function(e){
    document.getElementById('grid').innerHTML = '<div class="loadmsg">Could not load the vault — are you logged in? ('+esc(e.message)+')</div>';
  });
})();
</script>
</body>
</html>
