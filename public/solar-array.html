<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Kin Homestead - 3D Solar Array</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: sans-serif; }
        #info-panel {
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8);
            color: #fff; padding: 15px; border-radius: 8px; max-width: 300px;
            pointer-events: none; border: 1px solid #444;
        }
        h1 { margin: 0 0 10px 0; font-size: 18px; color: #f5a623; }
        p { margin: 5px 0; font-size: 13px; color: #ccc; }
    </style>
</head>
<body>

    <div id="info-panel">
        <h1>7 Kin Homestead</h1>
        <p><strong>Array Configuration:</strong> 3 High x 11 Across</p>
        <p><strong>Total Panels:</strong> 33 Monofacial</p>
        <p><strong>Tilt Angle:</strong> 35° Fixed Ground Mount</p>
        <p><strong>Racking:</strong> Horizontal Rail Configuration</p>
        <p><small>Left-click + drag to rotate. Right-click + drag to pan. Scroll to zoom.</small></p>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "/libs/three.module.min.js",
            "three/addons/": "/libs/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/OrbitControls.js';

        // --- 1. Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x22252a);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- 2. Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(20, 40, 20);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // --- 3. Ground ---
        const groundGeo = new THREE.PlaneGeometry(80, 50);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x3d4d3d, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- 4. Solar Array Parameters ---
        const ROWS = 3;
        const COLS = 11;
        const PANEL_WIDTH = 1.8;
        const PANEL_HEIGHT = 1.0;
        const PANEL_THICKNESS = 0.04;
        const TILT_RAD = 35 * (Math.PI / 180);

        // --- 5. Array Group ---
        const arrayGroup = new THREE.Group();

        const panelBlue   = new THREE.MeshStandardMaterial({ color: 0x1d2e44, roughness: 0.2, metalness: 0.5 });
        const frameSilver = new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.8, roughness: 0.2 });
        const railMat     = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.9 });

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const panel = new THREE.Group();

                const cell = new THREE.Mesh(
                    new THREE.BoxGeometry(PANEL_WIDTH - 0.05, PANEL_HEIGHT - 0.05, PANEL_THICKNESS),
                    panelBlue
                );
                cell.castShadow = true;
                panel.add(cell);

                const frame = new THREE.Mesh(
                    new THREE.BoxGeometry(PANEL_WIDTH, PANEL_HEIGHT, PANEL_THICKNESS - 0.01),
                    frameSilver
                );
                frame.position.z = -0.005;
                panel.add(frame);

                panel.position.set(
                    (c - (COLS - 1) / 2) * (PANEL_WIDTH + 0.02),
                    (r - (ROWS - 1) / 2) * (PANEL_HEIGHT + 0.02),
                    0
                );
                arrayGroup.add(panel);
            }
        }

        // --- 6. Racking Rails ---
        const totalWidth = COLS * (PANEL_WIDTH + 0.02);
        const railGeo = new THREE.BoxGeometry(totalWidth, 0.05, 0.05);

        for (let r = 0; r < ROWS; r++) {
            const railY = (r - (ROWS - 1) / 2) * (PANEL_HEIGHT + 0.02);
            const upper = new THREE.Mesh(railGeo, railMat);
            upper.position.set(0, railY + 0.25, -PANEL_THICKNESS);
            arrayGroup.add(upper);
            const lower = new THREE.Mesh(railGeo, railMat);
            lower.position.set(0, railY - 0.25, -PANEL_THICKNESS);
            arrayGroup.add(lower);
        }

        arrayGroup.rotation.x = -TILT_RAD;
        const heightOffset = ((ROWS * PANEL_HEIGHT) / 2) * Math.sin(TILT_RAD) + 1.5;
        arrayGroup.position.y = heightOffset;
        scene.add(arrayGroup);

        // --- 7. Support Legs ---
        const legGeo = new THREE.CylinderGeometry(0.04, 0.04, heightOffset * 1.5);
        const legMat = new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.7 });

        for (let i = -2; i <= 2; i++) {
            const leg = new THREE.Mesh(legGeo, legMat);
            leg.position.set(i * (totalWidth / 5), heightOffset / 2, -Math.cos(TILT_RAD));
            leg.rotation.x = Math.PI / 12;
            scene.add(leg);
        }

        // --- 8. Render Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
